name: Release

on:
  push:
    tags:
      - "V*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            gcc-14 \
            g++-14 \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libsqlite3-dev \
            libwayland-bin \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            ninja-build \
            pkg-config

      - name: Install CMake 4.4.4
        run: |
          set -euo pipefail
          version=4.4.4
          tarball="cmake-${version}-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v${version}/${tarball}"
          curl -fsSL -o "/tmp/${tarball}" "$url"
          echo "e5bb807f7728cb60cd8b27ebc97a2edb469b68655f21e844a600c3575b76f5bb  /tmp/${tarball}" | sha256sum -c -
          sudo tar -C /usr/local --strip-components=1 -xzf "/tmp/${tarball}"
          cmake --version

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --preset release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="requestman-${tag}-linux-x86_64"
          stage="dist/${name}"
          binary="${stage}/requestman"
          mkdir -p "${stage}/third_party/curl-impersonate"

          cp -a release/requestman "${binary}"
          strip --strip-unneeded "${binary}"

          cp -a release/libcurl-impersonate.so* "${stage}/"
          find release/curl-impersonate-runtime -maxdepth 1 -type f -name 'LICENSE*' \
            -exec cp -a {} "${stage}/third_party/curl-impersonate/" \;
          if ! compgen -G "${stage}/third_party/curl-impersonate/LICENSE*" > /dev/null; then
            echo "curl-impersonate license files were not staged"
            exit 1
          fi

          sqlite="$(ldd release/requestman | awk '/libsqlite3\.so\.0 =>/ { print $3; exit }')"
          if [[ -z "${sqlite}" || ! -e "${sqlite}" ]]; then
            echo "could not resolve libsqlite3.so.0 from the build tree"
            ldd release/requestman
            exit 1
          fi
          cp -L "${sqlite}" "${stage}/libsqlite3.so.0"

          cp -a release/assets "${stage}/assets"
          cp -a LICENSE "${stage}/LICENSE"

          rpaths="$(readelf -d "${binary}" | sed -n 's/.*Library r\(un\)\?path: \[\([^]]*\)\].*/\2/p' | sort -u)"
          if [[ "${rpaths}" != '$ORIGIN' ]]; then
            echo "expected RUNPATH \$ORIGIN, got: ${rpaths:-<empty>}"
            readelf -d "${binary}"
            exit 1
          fi

          stage_real="$(realpath "${stage}")"
          resolved="$(ldd "${binary}" | awk '/libcurl-impersonate|libsqlite3\.so/ { print $1, $3 }')"
          if [[ -z "${resolved}" ]]; then
            echo "ldd did not list libcurl-impersonate or libsqlite3"
            ldd "${binary}"
            exit 1
          fi
          echo "${resolved}" | awk -v stage="${stage_real}" '
            BEGIN { curl = 0; sqlite = 0 }
            {
              lib = $1
              path = $2
              if (lib ~ /libcurl-impersonate/) curl++
              if (lib ~ /libsqlite3\.so/) sqlite++
              if (path == "not" || index(path, stage "/") != 1) {
                printf "expected %s inside %s, got %s\n", lib, stage, path > "/dev/stderr"
                exit 1
              }
            }
            END {
              if (curl == 0 || sqlite == 0) {
                print "ldd is missing libcurl-impersonate or libsqlite3" > "/dev/stderr"
                exit 1
              }
            }
          '

          archive="dist/${name}.tar.gz"
          tar -C dist -czf "${archive}" "${name}"
          tar -tzf "${archive}" | grep -Fxq "${name}/requestman"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="dist/requestman-${tag}-linux-x86_64.tar.gz"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
          else
            gh release create "${tag}" "${asset}" --generate-notes --title "${tag}"
          fi
